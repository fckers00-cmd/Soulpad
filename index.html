<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0d;
  --surface: #111118;
  --border: #1e1e2c;
  --border2: #28283c;
  --amber: #e8a020;
  --amber-dim: #5a3d0a;
  --amber-glow: rgba(232,160,32,0.10);
  --text: #c4c4d4;
  --muted: #42425a;
  --green: #4ade80;
  --green-bg: rgba(74,222,128,0.10);
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Courier New', monospace;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* ── HEADER ── */
.header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.logo { font-size: 12px; font-weight: bold; color: var(--amber); letter-spacing: 3px; flex-shrink: 0; }
.hsel {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 6px;
  color: var(--text);
  font-family: inherit;
  font-size: 11px;
  padding: 5px 6px;
  outline: none;
  cursor: pointer;
  flex: 1;
}
.hsel option { background: #1e1e2c; }
.kill {
  padding: 5px 12px;
  background: transparent;
  border: 1px solid #4a1a1a;
  border-radius: 6px;
  color: #884444;
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.12s;
  flex-shrink: 0;
  letter-spacing: 1px;
}
.kill:active, .kill.flash {
  border-color: #e74c3c;
  color: #e74c3c;
  background: rgba(231,76,60,0.12);
}

/* ── TABS ── */
.tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.tab {
  flex: 1;
  padding: 9px 0;
  text-align: center;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.12s;
}
.tab.on { color: var(--amber); border-bottom-color: var(--amber); }

/* ── PANELS ── */
.panels { flex: 1; overflow: hidden; position: relative; min-height: 0; }
.panel { display: none; flex-direction: column; height: 100%; padding: 10px; gap: 8px; overflow-y: auto; }
.panel.on { display: flex; }

/* ── ROW ── */
.row { display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
.lbl { font-size: 9px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; flex-shrink: 0; }

/* ── SEG BUTTONS ── */
.seg { display: flex; gap: 3px; flex-wrap: wrap; }
.sb {
  padding: 4px 9px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 5px;
  color: var(--muted);
  font-family: inherit;
  font-size: 10px;
  cursor: pointer;
  transition: all 0.1s;
  white-space: nowrap;
}
.sb.on { border-color: var(--amber-dim); color: var(--amber); background: var(--amber-glow); }
/* green underline marks which page the playhead is currently in */
.sb.ph { box-shadow: inset 0 -2px 0 var(--green); }

/* ── RANGE ── */
input[type=range] {
  flex: 1; -webkit-appearance: none;
  height: 3px; background: var(--border2); border-radius: 2px; outline: none; min-width: 40px;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px;
  background: var(--amber); border-radius: 50%; cursor: pointer;
}
.rv { font-size: 10px; color: var(--amber); width: 34px; text-align: right; flex-shrink: 0; }

/* ── CHORD PADS ── */
.chord-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  flex: 1;
  min-height: 0;
}
.cp {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.06s;
  min-height: 60px;
}
.cp::after {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, var(--amber-glow) 0%, transparent 70%);
  opacity: 0; transition: opacity 0.1s;
}
.cp.lit { border-color: var(--amber-dim); }
.cp.lit::after { opacity: 1; }
.cp.pressing { transform: scale(0.95); }
.cp .roman { font-size: 8px; color: var(--muted); letter-spacing: 1px; }
.cp .cname { font-size: 15px; font-weight: bold; color: var(--text); }
.cp.lit .cname { color: var(--amber); }
.cp .cqual { font-size: 9px; color: var(--muted); }

/* ── MELODY GRID ── */
.mel-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 5px;
  min-height: 0;
}
.mk {
  background: #0d0d14;
  border: 1px solid #181828;
  border-radius: 8px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: pointer;
  transition: transform 0.05s, border-color 0.08s;
  gap: 1px;
  position: relative;
  overflow: hidden;
  min-height: 0;
}
/* in-scale highlight */
.mk.inscale {
  background: #111122;
  border-color: #22223a;
}
/* root note */
.mk.root {
  background: #141220;
  border-color: var(--amber-dim);
}
.mk.root .mn { color: var(--amber-dim); }
/* pressing */
.mk.pressing {
  transform: scale(0.91);
  border-color: var(--amber) !important;
  background: var(--amber-glow) !important;
}
.mk.pressing .mn { color: var(--amber) !important; }
.mk .mn { font-size: 11px; font-weight: bold; color: var(--muted); }
.mk.inscale .mn { color: #8888cc; }
.mk .mo { font-size: 7px; color: var(--muted); opacity: 0.4; }

/* ── SEQ ── */
.seq-top { display: flex; gap: 6px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
.seq-btn {
  padding: 6px 12px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 7px;
  color: var(--muted); font-family: inherit; font-size: 11px;
  cursor: pointer; transition: all 0.1s; white-space: nowrap;
}
.seq-btn.playing { border-color: var(--green); color: var(--green); background: var(--green-bg); }
.seq-btn.midi-btn { margin-left: auto; }
.seq-btn.arm { border-color: #e74c3c; color: #e74c3c; background: rgba(231,76,60,0.12); }
.seq-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 5px; flex-shrink: 0;
}
.step {
  aspect-ratio: 1;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 7px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: pointer; font-size: 8px; color: var(--muted);
  transition: all 0.08s; position: relative; overflow: hidden;
}
.step .sn { font-size: 7px; color: var(--muted); position: absolute; top: 3px; left: 5px; }
.step .sl { font-size: 9px; font-weight: bold; }
.step .sx { position: absolute; top: 2px; right: 4px; font-size: 9px; color: var(--muted); opacity: 0; }
.step.has .sx { opacity: 1; }
.step.has { background: #111122; border-color: var(--amber-dim); color: var(--amber); }
/* tied (covered) step — part of a held note */
.step.tied { background: #100f18; border-color: var(--amber-dim); color: var(--amber-dim); }
.step.tied .sl { font-size: 13px; color: var(--amber-dim); }
.step.tied .sx { opacity: 0; }
/* length badge on a note head */
.step .sbass { position: absolute; bottom: 2px; left: 4px; font-size: 7px; color: var(--amber-dim); }
.step .slen { position: absolute; bottom: 2px; right: 4px; font-size: 8px; font-weight: bold; color: var(--amber); }
.step.cur { border-color: var(--green); background: var(--green-bg); color: var(--green); }
.seq-hint { font-size: 10px; color: var(--muted); text-align: center; flex-shrink: 0; }

/* ── TRACK LABELS ── */
.track-label {
  font-size: 8px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  flex-shrink: 0;
  padding: 2px 0;
}

/* ── DRUM LANES (16 toggles per row, TR-808 style) ── */
.drum-lane { display: flex; align-items: center; gap: 5px; flex-shrink: 0; margin-bottom: 3px; }
.dlabel { font-size: 9px; font-weight: bold; color: var(--muted); width: 12px; flex-shrink: 0; text-align: center; }
.drum-row { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; flex: 1; }
.dcell {
  aspect-ratio: 1;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.06s;
}
/* beat grouping: every 4th cell a touch brighter border */
.dcell:nth-child(4n+1) { border-color: #34344a; }
.dcell.on { background: var(--amber); border-color: var(--amber); }
.dcell.cur { box-shadow: inset 0 0 0 2px var(--green); }

/* ── NOTE PICKER GRID — 6×4 fourths ── */
.note-picker-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 4px;
  flex: 1;
  min-height: 0;
}
.npk {
  background: #0d0d14;
  border: 1px solid #181828;
  border-radius: 7px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: pointer; gap: 1px;
  font-size: 10px; font-weight: bold;
  color: var(--muted);
  transition: all 0.08s;
}
.npk.inscale { background: #111122; border-color: #22223a; color: #8888cc; }
.npk.root { background: #141220; border-color: var(--amber-dim); color: var(--amber-dim); }
.npk:active { background: var(--amber-glow); border-color: var(--amber); color: var(--amber); transform: scale(0.91); }
.npk .no { font-size: 7px; color: var(--muted); opacity: 0.4; }

/* ── PICKER OVERLAY ── */
.picker {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,10,13,0.96);
  flex-direction: column;
  gap: 10px;
  padding: 16px;
  z-index: 100;
  overflow-y: auto;
}
.picker.on { display: flex; }
.picker-title { font-size: 10px; color: var(--amber); letter-spacing: 2px; text-transform: uppercase; flex-shrink: 0; }
.picker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pb {
  padding: 14px 4px;
  background: var(--surface); border: 1px solid var(--border2); border-radius: 8px;
  color: var(--text); font-family: inherit; font-size: 12px;
  cursor: pointer; text-align: center; transition: all 0.08s;
}
.pb:active { background: var(--amber-glow); border-color: var(--amber); color: var(--amber); }
.pcancel {
  padding: 12px; background: transparent; border: 1px solid var(--border2); border-radius: 8px;
  color: var(--muted); font-family: inherit; font-size: 11px; cursor: pointer; text-align: center;
  flex-shrink: 0; margin-top: auto;
}
</style>
</head>
<body>

<div class="header">
  <span class="logo">SOUL</span>
  <select class="hsel" id="keyS" onchange="onKeyMode()">
    <option>C</option><option>C#</option><option>Db</option><option>D</option>
    <option>Eb</option><option>E</option><option>F</option><option>F#</option>
    <option>Gb</option><option>G</option><option>Ab</option><option>A</option>
    <option>Bb</option><option>B</option>
  </select>
  <select class="hsel" id="modeS" onchange="onKeyMode()">
    <option value="dorian">Dorian</option>
    <option value="aeolian">Minor</option>
    <option value="melodic minor">Melodic Min</option>
    <option value="ionian">Major</option>
    <option value="lydian">Lydian</option>

</div>

<div class="tabs">

  <div class="tab" onclick="showTab('melody',this)">MELODY</div>

</div>

<div class="panels">

  <!-- CHORD -->
  <div class="panel on" id="panel-chord">
    <div class="row">
      <span class="lbl">Ext</span>
      <div class="seg" id="eseg">

        <button class="sb" data-val="9" onclick="setExt(9,this)">9</button>

        <button class="sb" data-val="13" onclick="setExt(13,this)">13</button>
      </div>
      <span class="lbl" style="margin-left:auto">Bass</span>
      <div class="seg" id="bseg">

        <button class="sb" data-val="true" onclick="setBass(true,this)">On</button>
      </div>
    </div>
    <div class="row">
      <span class="lbl">Voicing</span>
      <div class="seg" id="vseg">
        <button class="sb on" data-val="close" onclick="setV('close',this)">Close</button>
        <button class="sb" data-val="drop2" onclick="setV('drop2',this)">Drop2</button>
        <button class="sb" data-val="spread" onclick="setV('spread',this)">Spread</button>
        <button class="sb" data-val="shell" onclick="setV('shell',this)">Shell</button>
        <button class="sb" data-val="rootless" onclick="setV('rootless',this)">–Root</button>

        <button class="sb" data-val="latch" onclick="setPM('latch',this)">Latch</button>
      </div>
      <span class="lbl" style="margin-left:auto">Strum</span>
      <input type="range" id="strumR" min="5" max="80" value="22"
        oninput="SD=this.value/1000;document.getElementById('strumV').textContent=this.value+'ms';autosave()">
      <span class="rv" id="strumV">22ms</span>
    </div>
    <div class="row">
      <span class="lbl">Octave</span>
      <div class="seg" id="coseg">
        <button class="sb" data-val="2" onclick="setChordOct(2,this)">Low</button>
        <button class="sb on" data-val="3" onclick="setChordOct(3,this)">Mid</button>
        <button class="sb" data-val="4" onclick="setChordOct(4,this)">High</button>
      </div>

  <!-- MELODY -->

    <div class="seq-hint" id="seqHint">notes: tap=assign · tap again=length · hold=clear &nbsp;·&nbsp; drums: tap=on/off</div>

    <!-- Chord Picker -->
    <div class="picker" id="chordPicker">
      <span class="picker-title">pick chord</span>
      <div class="picker-grid" id="pickerGrid"></div>

    <!-- Note Picker — 6×4 fourths grid -->

      <span class="picker-title">pick note</span>

      <button class="pcancel" onclick="closePicker()">cancel</button>
    </div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════
// AUDIO — FM Rhodes engine, Web Audio API
// ═══════════════════════════════════════════════
let actx, master, rvbDelay, rvbFb, rvbWet;
let tremOsc, tremGain;        // shared tremolo LFO (1 osc for all voices)
let noiseBuffer, drumBus;     // shared noise source + dry drum bus
let bassBus;                  // dry bass bus (bypass reverb — keeps the low end tight)
let limiter, limOut;          // every bus → limiter → limOut → speakers
let audioUp = false;
const voices = new Map();
const MAXPOLY = 8;

// FM Rhodes voice params (tunable)
const FM = {
  modIndex: 3.2,   // modulator depth ratio
  modDecay: 0.35,  // FM brightness decay (s) — the "bell" attack
  ampDecay: 1.2,   // body decay to sustain (s)
  tremDepth: 0.15, // tremolo amount
  tremRate: 5,     // tremolo speed (Hz) — classic Rhodes
  filterHz: 3200,  // warmth lowpass
};

// Output limiter — only acts on peaks near full scale (kick + chord, full mix).
// DynamicsCompressor adds its own make-up gain; LIM.trim takes it back out so
// quiet playing comes out at the same level as with no limiter.
const LIM = { on: true, threshold: -1, knee: 0, ratio: 20, attack: 0.001, release: 0.12, trim: 0.946 };   // trim = −0.48 dB, measured

async function bootAudio() {
  if (audioUp) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  limOut = actx.createGain(); limOut.connect(actx.destination);
  limiter = actx.createDynamicsCompressor();
  limiter.threshold.value = LIM.threshold; limiter.knee.value = LIM.knee; limiter.ratio.value = LIM.ratio;
  limiter.attack.value = LIM.attack; limiter.release.value = LIM.release;
  limiter.connect(limOut);
  const out = LIM.on ? limiter : limOut;   // LIM.on = false → bypass (A/B by ear)
  limOut.gain.value = LIM.on ? LIM.trim : 1;
  master = actx.createGain(); master.gain.value = 0.55;
  rvbDelay = actx.createDelay(0.6); rvbDelay.delayTime.value = 0.2;
  rvbFb = actx.createGain(); rvbFb.gain.value = 0.42;
  rvbWet = actx.createGain(); rvbWet.gain.value = 0.2;
  rvbDelay.connect(rvbFb); rvbFb.connect(rvbDelay);
  rvbDelay.connect(rvbWet); rvbWet.connect(out);
  master.connect(out); master.connect(rvbDelay);

  // Drums on a dry bus (bypass reverb) for punch
  drumBus = actx.createGain(); drumBus.gain.value = 0.9;
  drumBus.connect(out);

  bassBus = actx.createGain(); bassBus.gain.value = BASS.level;
  bassBus.connect(out);

  // Shared white-noise buffer for snare/hat (created once, reused)
  noiseBuffer = actx.createBuffer(1, Math.floor(actx.sampleRate * 0.5), actx.sampleRate);
  const nd = noiseBuffer.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  // Shared tremolo LFO — ONE oscillator drives every voice (cheap on Android)
  tremOsc = actx.createOscillator();
  tremOsc.type = 'sine';
  tremOsc.frequency.value = FM.tremRate;
  tremGain = actx.createGain();
  tremGain.gain.value = FM.tremDepth;
  tremOsc.connect(tremGain);
  tremOsc.start();

  audioUp = true;
}

// Bass voice params (tunable) — triangle + sine sub, lowpass, soft attack. No FM.
const BASS = {
  level: 0.35,     // bassBus gain — chord alone already peaks ~0.95, see PLAN.md 1b
  attack: 0.025,   // soft attack (s) — no click
  decay: 0.9,      // settle to sustain (s)
  sustain: 0.7,    // fraction of peak held
  filterHz: 420,   // lowpass: keeps the triangle round
  sineMix: 0.6,    // sine under the triangle for weight
};

// Build one bass voice starting at t0. Same shape as an FM voice ({mod, carrier, env})
// so noteOff / fadeSeqNodes / allOff handle it unchanged.
// tEnd = null → live (hold at sustain until noteOff) · number → full envelope ending at tEnd.
function makeBass(freq, vel, t0, tEnd=null) {
  const carrier = actx.createOscillator();   // triangle = the tone
  carrier.type = 'triangle'; carrier.frequency.value = freq;
  const mod = actx.createOscillator();       // sine = the weight (named mod for the shared stop path)
  mod.type = 'sine'; mod.frequency.value = freq;
  const sineG = actx.createGain(); sineG.gain.value = BASS.sineMix;

  const env = actx.createGain();
  const peak = vel * 0.5, sus = peak * BASS.sustain;
  env.gain.setValueAtTime(0, t0);
  if (tEnd == null) {
    env.gain.linearRampToValueAtTime(peak, t0 + BASS.attack);
    env.gain.linearRampToValueAtTime(sus, t0 + BASS.attack + BASS.decay);
  } else {
    // every event stays in time order even on very short steps (no ramp after the release)
    const aEnd = Math.min(t0 + BASS.attack, tEnd - 0.02);
    env.gain.linearRampToValueAtTime(peak, aEnd);
    const dEnd = Math.min(aEnd + BASS.decay, tEnd - 0.03);
    if (dEnd > aEnd + 0.01) {
      env.gain.linearRampToValueAtTime(sus, dEnd);
      env.gain.setValueAtTime(sus, Math.max(tEnd - 0.08, dEnd));
    }
    env.gain.linearRampToValueAtTime(0.0001, tEnd);   // release (linear, never exp)
  }

  const filt = actx.createBiquadFilter();
  filt.type = 'lowpass'; filt.frequency.value = BASS.filterHz; filt.Q.value = 0.5;

  carrier.connect(env); mod.connect(sineG); sineG.connect(env);
  env.connect(filt); filt.connect(bassBus);
  carrier.start(t0); mod.start(t0);
  if (tEnd != null) { carrier.stop(tEnd + 0.1); mod.stop(tEnd + 0.1); }   // stop only after start
  return { mod, carrier, env };
}

// Bass note under a chord: the chord root in MIDI 36–47, pushed down an octave
// if that would sit on or above the chord's lowest note (Low octave, drop2).
function bassMidi(ch, midis) {
  const pc = Tonal.Note.chroma(ch.root);
  let m = 36 + ((pc - 36 % 12) + 12) % 12;
  const low = Math.min(...midis);
  while (m >= low && m - 12 >= 24) m -= 12;
  return m;
}

function bassOn(id, midi, vel=0.8) {
  if (!actx) return;
  noteOff(id);
  if (voices.size >= MAXPOLY) noteOff([...voices.keys()][0]);
  const v = makeBass(midiFreq(midi), vel, actx.currentTime + 0.012);
  v.dead = false;
  voices.set(id, v);   // stays tracked until noteOff — dropping it early leaves it ringing forever
}

function midiFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

function noteOn(id, freq, vel=0.75) {
  if (!actx) return;
  noteOff(id);
  if (voices.size >= MAXPOLY) noteOff([...voices.keys()][0]);
  const t = actx.currentTime + 0.012;

  // ── FM modulator (sine) → bright "bell" attack that decays ──
  const mod = actx.createOscillator();
  const modEnv = actx.createGain();
  mod.type = 'sine';
  mod.frequency.value = freq;
  const modDepth = freq * FM.modIndex;
  modEnv.gain.setValueAtTime(modDepth * 0.75, t);
  modEnv.gain.linearRampToValueAtTime(modDepth * 0.01, t + FM.modDecay);
  mod.connect(modEnv);

  // ── FM carrier (sine) — modEnv drives its frequency ──
  const carrier = actx.createOscillator();
  carrier.type = 'sine';
  carrier.frequency.value = freq;
  modEnv.connect(carrier.frequency);

  // ── Amp envelope — scaled by velocity ──
  const env = actx.createGain();
  env.gain.setValueAtTime(0, t);
  env.gain.linearRampToValueAtTime(vel * 0.5, t + 0.008);   // attack
  env.gain.linearRampToValueAtTime(vel * 0.26, t + FM.ampDecay); // decay to sustain

  // ── Warmth lowpass ──
  const filt = actx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.value = FM.filterHz;

  // ── Tremolo — shared LFO modulates this voice's gain ──
  const tremAmp = actx.createGain();
  tremAmp.gain.value = 1.0;
  if (tremGain) tremGain.connect(tremAmp.gain);
  // free the shared tremolo connection when this voice ends (no leak under heavy play)
  carrier.onended = () => { try { tremGain && tremGain.disconnect(tremAmp.gain); } catch(e){} };

  carrier.connect(env); env.connect(filt); filt.connect(tremAmp); tremAmp.connect(master);
  mod.start(t); carrier.start(t);

  const v = { mod, carrier, env, dead: false };
  voices.set(id, v);   // stays tracked until noteOff — dropping it early leaves it ringing forever
}

function noteOff(id) {
  const v = voices.get(id);
  if (!v || v.dead) return;
  v.dead = true; voices.delete(id);
  const now = actx.currentTime;
  const cur = Math.max(v.env.gain.value, 0.001);
  v.env.gain.cancelScheduledValues(now);
  v.env.gain.setValueAtTime(cur, now);
  v.env.gain.linearRampToValueAtTime(0, now + 0.22);
  try { v.mod.stop(now + 0.25); } catch(e) {}
  try { v.carrier.stop(now + 0.25); } catch(e) {}
}

function allOff() { [...voices.keys()].forEach(noteOff); }

function killAll(btn) {
  allOff();
  strumT.forEach(clearTimeout); strumT = [];
  latchPad = null;
  if (seqOn) {                       // panic also stops the running sequencer
    stopSeq();
    const pb = document.getElementById('playBtn');
    if (pb) { pb.textContent = '▶ PLAY'; pb.classList.remove('playing'); }
  } else {
    fadeSeqNodes();                  // silence any lingering scheduled tails
  }
  document.querySelectorAll('.cp').forEach(p => p.classList.remove('lit'));
  if (btn) { btn.classList.add('flash'); setTimeout(()=>btn.classList.remove('flash'), 200); }
}

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
const S = { key:'C', mode:'dorian', ext:7, bass:false, voicing:'close', playMode:'touch', chordOct:3, melOct:4, bpm:90, subdiv:'8n', swing:0 };

// Step resolution map (tpb=480): MIDI ticks per step + beat fraction
const SUBDIV = {
  '4n':  { ticks: 480, beats: 1.0  },
  '8n':  { ticks: 240, beats: 0.5  },
  '16n': { ticks: 120, beats: 0.25 },
};
let SD = 0.022;  // strum delay seconds
let strumT = [];
let latchPad = null;

// SEQ — custom Web Audio scheduler (no Tone.js)
const STEPS = 32;            // full timeline: 16 call + 16 respond
const PAGE  = 16;            // steps shown on screen at once
let viewPage = 0;            // 0 = CALL (1-16), 1 = RESPOND (17-32)
let chordSeq = Array(STEPS).fill(null);
let melSeq   = Array(STEPS).fill(null);
let drumSeq  = { kick: Array(STEPS).fill(false), snare: Array(STEPS).fill(false), hat: Array(STEPS).fill(false) };
let seqOn = false;
let curStep = 0;             // next step index to schedule
let nextStepTime = 0;        // audio-clock time of next step
let schedTimer = null;       // setInterval handle for the scheduler
let rafId = null;            // requestAnimationFrame handle for playhead
let lastDrawn = -1;          // last step highlighted
const drawQueue = [];        // {step, time} pending playhead updates
let seqNodes = [];           // scheduled voices {mod,carrier,env,end} for stop/kill
const LOOKAHEAD = 0.10;      // schedule this many seconds ahead
const SCHED_TICK = 25;       // scheduler poll interval (ms)
let pickStep = null, pickTrack = null;
let longPressTimer = null;

// ═══════════════════════════════════════════════
// TONAL.JS HELPERS
// ═══════════════════════════════════════════════
function getScaleNotes() {
  // e.g. Tonal.Scale.get("C dorian").notes => ["C","D","Eb","F","G","A","Bb"]
  const sc = Tonal.Scale.get(`${S.key} ${S.mode}`);
  return sc.notes.length ? sc.notes : ['C','D','E','F','G','A','B'];
}

// 7th-chord quality from semitones of 3rd / 5th / 7th above the root
const QUAL = {
  '4,7,11': 'maj7', '3,7,10': 'm7', '4,7,10': '7', '3,6,10': 'm7b5',
  '3,7,11': 'mMaj7', '4,8,11': 'maj7#5',
};
// headline name per quality for n = 7/9/11/13 (e.g. m7b5 @11 → m11b5)
const QNAME = {
  'maj7':   n => 'maj' + n,
  'm7':     n => 'm' + n,
  '7':      n => '' + n,
  'm7b5':   n => 'm' + n + 'b5',
  'mMaj7':  n => 'mMaj' + n,
  'maj7#5': n => 'maj' + n + '#5',
};
const EXTS = [7, 9, 11, 13];
// chord-tone labels for the pad subtitle (semitones above root)
const DEG = { 0:'1', 3:'b3', 4:'3', 6:'b5', 7:'5', 8:'#5', 10:'b7', 11:'7', 14:'9', 17:'11', 18:'#11', 21:'13' };

// Build the chord on scale degree `deg` with extensions up to `ext`.
// Tensions come from the scale, filtered by chord family:
//   all: never b9 / b13 · minor: natural 11 only · maj & dom: #11 only
// 5th is dropped once an 11 or 13 is in, unless it is altered (b5/#5).
// Returns { root, chordName, quality, roman, ivs } — ivs = semitones above root.
function buildScaleChord(notes, deg, ext) {
  const root = notes[deg];
  const rc = Tonal.Note.chroma(root);
  const st = k => (Tonal.Note.chroma(notes[(deg + k) % 7]) - rc + 12) % 12;
  const third = st(2), fifth = st(4), seventh = st(6);
  const quality = QUAL[third + ',' + fifth + ',' + seventh] || null;
  const minor = third === 3, dom = third === 4 && seventh === 10;

  const t9 = st(1), t11 = st(3), t13 = st(5);
  const ok9  = t9 === 2;
  const ok11 = minor ? t11 === 5 : t11 === 6;
  const ok13 = t13 === 9;
  const has9  = ext >= 9  && ok9;
  const has11 = ext >= 11 && ok11;
  const has13 = ext >= 13 && ok13;

  const ivs = [0, third];
  if (!((has11 || has13) && fifth === 7)) ivs.push(fifth);
  ivs.push(seventh);
  if (has9)  ivs.push(12 + t9);
  if (has11) ivs.push(12 + t11);
  if (has13) ivs.push(12 + t13);

  let suffix;
  if (!quality) {
    // outside the known set — spell the stack rather than guess a name
    suffix = '(' + ivs.join(',') + ')';
  } else {
    const nat11 = has11 && t11 === 5, sharp11 = has11 && t11 === 6;
    let n = 7;
    if (has9) n = has13 ? 13 : (nat11 ? 11 : 9);
    suffix = QNAME[quality](n);
    if (has9) {
      if (sharp11) suffix += '#11';
    } else {
      const adds = [];
      if (has11) adds.push(sharp11 ? '#11' : '11');
      if (has13) adds.push('13');
      if (adds.length) suffix += '(' + adds.join(',') + ')';
    }
  }
  const ROMAN = ['I','II','III','IV','V','VI','VII'];
  return { root, chordName: root + suffix, quality: suffix, roman: ROMAN[deg], ivs };
}

function getDiatonicChords() {
  const notes = getScaleNotes();
  return notes.map((_, deg) => buildScaleChord(notes, deg, S.ext));
}

// ch = chord from buildScaleChord (needs .root + .ivs)
function chordToMidis(ch, voicing, octBase=3) {
  // root by pitch class, so Cb sits with B and B# with C (Tonal's "Cb2" is B1 — an octave low)
  const pc = Tonal.Note.chroma(ch.root);
  if (pc == null || Number.isNaN(pc) || !ch.ivs || !ch.ivs.length) return [];
  const base = 12 * (octBase + 1) + pc;

  // close = stacked 3rds; tensions (9/11/13) sit in the octave above
  let midis = ch.ivs.map(iv => base + iv).sort((a,b)=>a-b);

  switch(voicing) {
    case 'drop2':
      if (midis.length >= 3) { midis[midis.length-2] -= 12; midis.sort((a,b)=>a-b); }
      break;
    case 'spread':
      midis = midis.map((m,i) => i%2===1 ? m+12 : m);
      midis.sort((a,b)=>a-b);
      break;
    case 'rootless':
      midis = midis.slice(1);
      break;
    case 'shell': {
      // 3rd + 7th, plus the top tension so the extension still reads
      const tens = ch.ivs.filter(iv => iv > 12);
      const keep = [ch.ivs[1], ch.ivs[ch.ivs.length - 1 - tens.length]];
      if (tens.length) keep.push(tens[tens.length - 1]);
      midis = keep.map(iv => base + iv).sort((a,b)=>a-b);
      break;
    }
  }
  return midis;
}

// ═══════════════════════════════════════════════
// STRUM
// ═══════════════════════════════════════════════
function strum(midis, idPfx) {
  strumT.forEach(clearTimeout); strumT = [];
  // Don't allOff here — let previous notes fade via envelope
  // Only kill voices that share the same id prefix (same pad retriggered)
  midis.forEach((_,i) => noteOff(idPfx+'_'+i));

  midis.forEach((midi, i) => {
    const t = setTimeout(async () => {
      await bootAudio();
      const vel = 0.5 + (i/midis.length)*0.3 + Math.random()*0.08;
      noteOn(idPfx+'_'+i, midiFreq(midi), Math.min(vel,0.9));
    }, Math.round(i * SD * 1000 + (Math.random()-0.5)*5));
    strumT.push(t);
  });
}

// ═══════════════════════════════════════════════
// BUILD CHORD PADS
// ═══════════════════════════════════════════════
function buildChords() {
  const grid = document.getElementById('chordGrid');
  grid.innerHTML = '';
  const chords = getDiatonicChords();
  chords.forEach((ch, idx) => {
    const pad = document.createElement('div');
    pad.className = 'cp';
    pad.innerHTML = `
      <div class="roman">${ch.roman}</div>
      <div class="cname">${ch.chordName}</div>
      <div class="cqual">${ch.ivs.map(iv => DEG[iv] || iv).join(' ')}</div>
    `;
    const getMidis = () => chordToMidis(ch, S.voicing, S.chordOct);

    let canRelease = false;
    let releaseQueued = false;
    let relTimer = null;

    const onDown = async (e) => {
      e.preventDefault();
      await bootAudio();
      pad.classList.add('pressing');
      canRelease = false;
      releaseQueued = false;
      if (relTimer) { clearTimeout(relTimer); relTimer = null; }

      const midis = getMidis();
      const strumDur = midis.length * SD * 1000 + 40; // total strum time + buffer

      if (S.playMode === 'touch') {
        strum(midis, 'c'+idx);
        if (S.bass) bassOn('c'+idx+'_b', bassMidi(ch, midis));
        document.querySelectorAll('.cp').forEach(p=>p.classList.remove('lit'));
        pad.classList.add('lit');
        // enable release only after strum finishes
        relTimer = setTimeout(() => {
          canRelease = true;
          if (releaseQueued) doRelease();
        }, strumDur);
      } else {
        // always cancel pending strum timers first
        strumT.forEach(clearTimeout); strumT=[];
        if (latchPad === pad) {
          // same pad = unlatch
          allOff();
          pad.classList.remove('lit');
          latchPad = null;
        } else {
          // new pad = release all old voices then strum new
          allOff();
          if (latchPad) latchPad.classList.remove('lit');
          strum(midis, 'c'+idx);
          if (S.bass) bassOn('c'+idx+'_b', bassMidi(ch, midis));
          pad.classList.add('lit');
          latchPad = pad;
        }
      }
    };

    const doRelease = () => {
      getMidis().forEach((_,i) => noteOff('c'+idx+'_'+i));
      noteOff('c'+idx+'_b');
      pad.classList.remove('lit');
    };

    const onUp = () => {
      pad.classList.remove('pressing');
      if (S.playMode === 'touch') {
        if (canRelease) doRelease();
        else releaseQueued = true; // release as soon as strum finishes
      }
    };
    pad.addEventListener('mousedown', onDown);
    pad.addEventListener('mouseup', onUp);
    pad.addEventListener('touchstart', e=>{e.preventDefault();onDown(e);},{passive:false});
    pad.addEventListener('touchend', onUp);
    pad.addEventListener('touchcancel', onUp);
    grid.appendChild(pad);
  });
  autosave();
}

// ═══════════════════════════════════════════════
// BUILD MELODY GRID — 6×4 Fourths Layout
// ═══════════════════════════════════════════════
// Row interval: +5 semitones (perfect 4th) bottom→top
// Col interval: +1 semitone left→right
// Start note: root of key at S.melOct
function buildMelody() {
  const grid = document.getElementById('melGrid');
  grid.innerHTML = '';

  const scaleNotes = getScaleNotes();
  // Build chromatic set for in-scale detection
  const scaleChroma = new Set(
    scaleNotes.map(n => Tonal.Note.chroma(n))
  );
  const rootChroma = Tonal.Note.chroma(S.key);

  // Start midi = root note at chosen octave
  const startMidi = Tonal.Note.midi(S.key + S.melOct);

  // 4 rows × 6 cols
  // row 0 = bottom (lowest), row 3 = top (highest) — then we render top-first
  const rows = [];
  for (let row = 0; row < 4; row++) {
    const rowNotes = [];
    for (let col = 0; col < 6; col++) {
      const midi = startMidi + (row * 5) + col; // +4th per row, +semitone per col
      const noteName = Tonal.Note.fromMidi(midi);
      const pc = Tonal.Note.pitchClass(noteName);
      const oct = Tonal.Note.octave(noteName);
      const chroma = Tonal.Note.chroma(noteName);
      const inScale = scaleChroma.has(chroma);
      const isRoot = chroma === rootChroma;
      rowNotes.push({ midi, pc, oct, inScale, isRoot });
    }
    rows.push(rowNotes);
  }

  // Render top row first (highest pitch)
  [...rows].reverse().forEach(rowNotes => {
    rowNotes.forEach(p => {
      const k = document.createElement('div');
      let cls = 'mk';
      if (p.isRoot) cls += ' root';
      else if (p.inScale) cls += ' inscale';
      k.className = cls;
      k.innerHTML = `<span class="mn">${p.pc}</span><span class="mo">${p.oct}</span>`;

      const id = 'mel_' + p.midi;
      const onDown = async (e) => {
        e.preventDefault();
        await bootAudio();
        k.classList.add('pressing');
        noteOn(id, midiFreq(p.midi), 0.72);
      };
      const onUp = () => {
        k.classList.remove('pressing');
        noteOff(id);
      };

      k.addEventListener('mousedown', onDown);
      k.addEventListener('mouseup', onUp);
      k.addEventListener('touchstart', e=>{e.preventDefault();onDown(e);},{passive:false});
      k.addEventListener('touchend', onUp);
      k.addEventListener('touchcancel', onUp);
      grid.appendChild(k);
    });
  });
  autosave();
}

// ═══════════════════════════════════════════════
// SEQ
// ═══════════════════════════════════════════════
function seqOf(track){ return track === 'chord' ? chordSeq : melSeq; }

// index of the note whose length covers step i, else -1
function coveredParent(seq, i) {
  for (let j = i - 1; j >= 0; j--) {
    if (seq[j]) { const L = seq[j].len || 1; return (j + L > i) ? j : -1; }
  }
  return -1;
}
// max span a note at i can hold: itself + consecutive empty steps (no loop wrap)
function maxLenAt(seq, i) {
  let n = 1, k = i + 1;
  while (k < STEPS && seq[k] == null) { n++; k++; }
  return n;
}
// cycle length through valid options that fit (always includes 1)
function cycleLen(seq, i) {
  if (!seq[i]) return;
  const opts = [1,2,4].filter(L => L <= maxLenAt(seq, i));
  const cur = seq[i].len || 1;
  const idx = opts.indexOf(cur);
  seq[i].len = opts[(idx + 1) % opts.length];
}

function buildStep(track, i, label) {
  const seq = seqOf(track);
  const data = seq[i];
  const parent = data ? -1 : coveredParent(seq, i);
  const tied = parent >= 0;

  const s = document.createElement('div');
  s.className = 'step' + (data ? ' has' : '') + (tied ? ' tied' : '');
  s.id = track + 'step' + i;

  const len = data ? (data.len || 1) : 1;
  const badge = ((data && len > 1) ? `<span class="slen">×${len}</span>` : '')
              + ((data && data.bass != null) ? '<span class="sbass">B</span>' : '');
  const mid = data ? label : (tied ? '►' : '—');
  s.innerHTML = `<span class="sn">${i+1}</span><span class="sl">${mid}</span>${badge}<span class="sx">×</span>`;

  let lpFired = false;

  // tap: filled → cycle length · empty → picker · tied → locked
  s.addEventListener('click', () => {
    if (lpFired) { lpFired = false; return; }   // long-press already acted
    if (data) { cycleLen(seq, i); buildSeq(); }
    else if (!tied) openPicker(track, i);
  });

  // long press = clear (on a tied cell, clears its parent note)
  const startLP = () => {
    lpFired = false;
    longPressTimer = setTimeout(() => {
      lpFired = true;
      seq[ data ? i : (tied ? parent : i) ] = null;
      buildSeq();
    }, 500);
  };
  s.addEventListener('touchstart', startLP, {passive:true});
  s.addEventListener('touchend', () => clearTimeout(longPressTimer));
  s.addEventListener('touchcancel', () => clearTimeout(longPressTimer));

  return s;
}

function buildSeq() {
  const ct = document.getElementById('chordTrack');
  const mt = document.getElementById('melTrack');
  ct.innerHTML = ''; mt.innerHTML = '';

  const base = viewPage * PAGE;
  for (let k = 0; k < PAGE; k++) {
    const i = base + k;                 // absolute step index
    const cd = chordSeq[i];
    const md = melSeq[i];
    ct.appendChild(buildStep('chord', i, cd ? cd.chordName : ''));
    mt.appendChild(buildStep('mel',   i, md ? md.pc + md.oct : ''));
  }
  autosave();
}

function buildDrums() {
  const wrap = document.getElementById('drumTracks');
  wrap.innerHTML = '';
  const base = viewPage * PAGE;
  [['kick','K'],['snare','S'],['hat','H']].forEach(([voice, letter]) => {
    const lane = document.createElement('div'); lane.className = 'drum-lane';
    const lbl = document.createElement('span'); lbl.className = 'dlabel'; lbl.textContent = letter;
    const row = document.createElement('div'); row.className = 'drum-row';
    for (let k = 0; k < PAGE; k++) {
      const i = base + k;                          // absolute step index
      const c = document.createElement('div');
      c.className = 'dcell' + (drumSeq[voice][i] ? ' on' : '');
      c.id = 'd_' + voice + '_' + i;
      c.addEventListener('click', () => {          // tap toggles on/off
        drumSeq[voice][i] = !drumSeq[voice][i];
        c.classList.toggle('on');
        autosave();
      });
      row.appendChild(c);
    }
    lane.appendChild(lbl); lane.appendChild(row);
    wrap.appendChild(lane);
  });
}

function setPage(p, btn) {
  viewPage = p;
  btn.closest('.seg').querySelectorAll('.sb').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  buildSeq(); buildDrums();
}

function openPicker(track, idx) {
  // close silently without resetting pickStep/pickTrack
  document.getElementById('chordPicker').classList.remove('on');
  document.getElementById('notePicker').classList.remove('on');
  pickStep = idx; pickTrack = track;

  if (track === 'chord') {
    const chords = getDiatonicChords();
    const pg = document.getElementById('pickerGrid');
    pg.innerHTML = '';
    chords.forEach(ch => {
      const b = document.createElement('button');
      b.className = 'pb'; b.textContent = ch.chordName;
      b.onclick = () => assignChord(ch);
      pg.appendChild(b);
    });
    document.getElementById('chordPicker').classList.add('on');
  } else {
    buildNotePicker();
    document.getElementById('notePicker').classList.add('on');
  }
  // overlay handles visibility
}

function buildNotePicker() {
  const grid = document.getElementById('notePickerGrid');
  grid.innerHTML = '';
  const scaleChroma = new Set(getScaleNotes().map(n => Tonal.Note.chroma(n)));
  const rootChroma = Tonal.Note.chroma(S.key);
  const startMidi = Tonal.Note.midi(S.key + S.melOct);

  const rows = [];
  for (let row = 0; row < 4; row++) {
    const rowNotes = [];
    for (let col = 0; col < 6; col++) {
      const midi = startMidi + (row * 5) + col;
      const noteName = Tonal.Note.fromMidi(midi);
      const pc = Tonal.Note.pitchClass(noteName);
      const oct = Tonal.Note.octave(noteName);
      const chroma = Tonal.Note.chroma(noteName);
      rowNotes.push({ midi, pc, oct, inScale: scaleChroma.has(chroma), isRoot: chroma === rootChroma });
    }
    rows.push(rowNotes);
  }

  [...rows].reverse().forEach(rowNotes => {
    rowNotes.forEach(p => {
      const k = document.createElement('div');
      let cls = 'npk';
      if (p.isRoot) cls += ' root';
      else if (p.inScale) cls += ' inscale';
      k.className = cls;
      k.innerHTML = `${p.pc}<span class="no">${p.oct}</span>`;
      k.addEventListener('touchstart', e => { e.preventDefault(); assignNote(p); }, {passive:false});
      k.addEventListener('mousedown', () => assignNote(p));
      grid.appendChild(k);
    });
  });
}

function assignChord(ch) {
  if (pickStep === null) return;
  const midis = chordToMidis(ch, S.voicing, S.chordOct);
  const bass = S.bass ? bassMidi(ch, midis) : null;   // frozen with the step, like midis
  chordSeq[pickStep] = { ...ch, midis, bass, len: 1 };
  closePicker(); buildSeq();
}

function assignNote(p) {
  if (pickStep === null) return;
  melSeq[pickStep] = { ...p, len: 1 };
  closePicker(); buildSeq();
}

function closePicker(silent=false) {
  document.getElementById('chordPicker').classList.remove('on');
  document.getElementById('notePicker').classList.remove('on');
  pickStep = null; pickTrack = null;
}

// step duration (seconds) at current tempo + resolution — read live
function stepDur(){ return (60 / S.bpm) * SUBDIV[S.subdiv].beats; }

// Schedule one fully-enveloped FM voice on the audio clock (attack..release).
// Self-terminating: oscillators stop themselves at tEnd. No voices-Map needed.
function scheduleVoice(freq, vel, t0, tEnd){
  if (!actx) return;
  const peak = vel * 0.5, sus = vel * 0.24, rel = 0.18;

  const mod = actx.createOscillator();
  const modEnv = actx.createGain();
  mod.type = 'sine'; mod.frequency.value = freq;
  const depth = freq * FM.modIndex;
  modEnv.gain.setValueAtTime(depth * 0.75, t0);
  modEnv.gain.linearRampToValueAtTime(depth * 0.01, t0 + FM.modDecay);
  mod.connect(modEnv);

  const carrier = actx.createOscillator();
  carrier.type = 'sine'; carrier.frequency.value = freq;
  modEnv.connect(carrier.frequency);

  const env = actx.createGain();
  env.gain.setValueAtTime(0, t0);
  env.gain.linearRampToValueAtTime(peak, t0 + 0.008);          // attack
  const dEnd = Math.min(t0 + FM.ampDecay, tEnd - 0.03);
  if (dEnd > t0 + 0.02) {
    env.gain.linearRampToValueAtTime(sus, dEnd);               // decay to sustain
    env.gain.setValueAtTime(sus, Math.max(tEnd - 0.08, dEnd)); // hold sustain
  }
  env.gain.linearRampToValueAtTime(0.0001, tEnd);              // release (linear, never exp)

  const filt = actx.createBiquadFilter();
  filt.type = 'lowpass'; filt.frequency.value = FM.filterHz;

  const tremAmp = actx.createGain(); tremAmp.gain.value = 1.0;
  if (tremGain) tremGain.connect(tremAmp.gain);

  carrier.connect(env); env.connect(filt); filt.connect(tremAmp); tremAmp.connect(master);
  mod.start(t0); carrier.start(t0);
  mod.stop(tEnd + 0.1); carrier.stop(tEnd + 0.1);
  // free the shared tremolo connection when this voice ends (no leak)
  carrier.onended = () => { try { tremGain.disconnect(tremAmp.gain); } catch(e){} };

  seqNodes.push({ mod, carrier, env, end: tEnd + 0.1 });
}

// Scheduled bass voice (self-terminating, same release shape as scheduleVoice)
function scheduleBass(freq, t0, tEnd){
  if (!actx) return;
  const v = makeBass(freq, 0.8, t0, tEnd);
  seqNodes.push({ mod: v.mod, carrier: v.carrier, env: v.env, end: tEnd + 0.1 });
}

// ── Synth drum voices (Web Audio only, no samples) ──
function drumKick(t){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(50, t + 0.09);   // pitch drop = the "thump"
  g.gain.setValueAtTime(0.9, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);     // target 0.001 (never exactly 0)
  o.connect(g); g.connect(drumBus);
  o.start(t); o.stop(t + 0.4);
}
function drumSnare(t){
  // noise body
  const n = actx.createBufferSource(); n.buffer = noiseBuffer;
  const nf = actx.createBiquadFilter(); nf.type = 'highpass'; nf.frequency.value = 1200;
  const ng = actx.createGain();
  ng.gain.setValueAtTime(0.55, t);
  ng.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  n.connect(nf); nf.connect(ng); ng.connect(drumBus);
  n.start(t); n.stop(t + 0.2);
  // tonal snap
  const o = actx.createOscillator(), og = actx.createGain();
  o.type = 'triangle'; o.frequency.value = 180;
  og.gain.setValueAtTime(0.35, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  o.connect(og); og.connect(drumBus);
  o.start(t); o.stop(t + 0.12);
}
function drumHat(t){
  const n = actx.createBufferSource(); n.buffer = noiseBuffer;
  const hf = actx.createBiquadFilter(); hf.type = 'highpass'; hf.frequency.value = 7000;
  const hg = actx.createGain();
  hg.gain.setValueAtTime(0.28, t);
  hg.gain.exponentialRampToValueAtTime(0.001, t + 0.04);    // very short = tight hat
  n.connect(hf); hf.connect(hg); hg.connect(drumBus);
  n.start(t); n.stop(t + 0.05);
}

// Schedule everything that happens at one step, anchored to audio time `t`.
function scheduleStep(step, t){
  const dur = stepDur();
  const cd = chordSeq[step];            // covered/tied steps are null → naturally skipped
  if (cd) {
    const tEnd = t + cd.len * dur;
    cd.midis.forEach((midi, i) => {
      const strum = i * SD + (Math.random() - 0.5) * 0.004;
      const vel = 0.5 + (i / cd.midis.length) * 0.3;
      scheduleVoice(midiFreq(midi), vel, t + strum, tEnd);
    });
    if (cd.bass != null) scheduleBass(midiFreq(cd.bass), t, tEnd);
  }
  const md = melSeq[step];
  if (md) scheduleVoice(midiFreq(md.midi), 0.7, t, t + md.len * dur);

  // drums (t is already the swung time — off-beat hats swing for free)
  if (drumSeq.kick[step])  drumKick(t);
  if (drumSeq.snare[step]) drumSnare(t);
  if (drumSeq.hat[step])   drumHat(t);
}

// Scheduler: runs on a coarse timer, schedules steps inside the lookahead window.
function scheduler(){
  while (nextStepTime < actx.currentTime + LOOKAHEAD) {
    // swing: push off-beat (odd) steps later by a fraction of a step.
    // grid baseline (nextStepTime) stays uniform so timing never drifts.
    const swingOff = (curStep % 2 === 1) ? (S.swing / 100) * stepDur() : 0;
    const playTime = nextStepTime + swingOff;
    scheduleStep(curStep, playTime);
    drawQueue.push({ step: curStep, time: playTime });
    nextStepTime += stepDur();
    curStep = (curStep + 1) % STEPS;
  }
  seqNodes = seqNodes.filter(n => n.end > actx.currentTime);  // prune finished voices
}

// Playhead highlight, driven by the audio clock via rAF (visual only).
function drawLoop(){
  if (!seqOn) return;
  const now = actx.currentTime;
  let s = lastDrawn;
  while (drawQueue.length && drawQueue[0].time <= now) s = drawQueue.shift().step;
  if (s !== lastDrawn) {
    lastDrawn = s;
    document.querySelectorAll('.step.cur, .dcell.cur').forEach(el => el.classList.remove('cur'));

    // mark which page the playhead is in (green underline on the toggle)
    const phPage = Math.floor(s / PAGE);
    document.querySelectorAll('#pageSeg .sb').forEach((b, idx) => b.classList.toggle('ph', idx === phPage));

    // only light cells if the playhead is on the page you're viewing
    if (phPage === viewPage) {
      const ci = document.getElementById('chordstep' + s);
      const mi = document.getElementById('melstep' + s);
      if (ci) ci.classList.add('cur');
      if (mi) mi.classList.add('cur');
      ['kick','snare','hat'].forEach(v => {
        const dc = document.getElementById('d_' + v + '_' + s);
        if (dc) dc.classList.add('cur');
      });
    }
  }
  rafId = requestAnimationFrame(drawLoop);
}

// fade + stop all currently scheduled seq voices (used by stop and kill)
function fadeSeqNodes(){
  const now = actx ? actx.currentTime : 0;
  seqNodes.forEach(n => {
    try {
      n.env.gain.cancelScheduledValues(now);
      n.env.gain.setValueAtTime(Math.max(n.env.gain.value, 0.0001), now);
      n.env.gain.linearRampToValueAtTime(0.0001, now + 0.05);
      n.mod.stop(now + 0.06); n.carrier.stop(now + 0.06);
    } catch(e){}
  });
  seqNodes = [];
}

async function toggleSeq(){
  await bootAudio();
  if (actx.state !== 'running') await actx.resume();   // unlock audio on user gesture

  const btn = document.getElementById('playBtn');

  if (seqOn) {
    stopSeq();
    btn.textContent = '▶ PLAY'; btn.classList.remove('playing');
  } else {
    seqOn = true;
    curStep = 0;
    lastDrawn = -1;
    drawQueue.length = 0;
    seqNodes = [];
    nextStepTime = actx.currentTime + 0.08;   // small leading offset
    btn.textContent = '■ STOP'; btn.classList.add('playing');
    schedTimer = setInterval(scheduler, SCHED_TICK);
    scheduler();                               // schedule first window immediately
    rafId = requestAnimationFrame(drawLoop);
  }
}

function stopSeq(){
  seqOn = false;
  if (schedTimer) { clearInterval(schedTimer); schedTimer = null; }
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  fadeSeqNodes();
  drawQueue.length = 0;
  document.querySelectorAll('.step.cur, .dcell.cur').forEach(el => el.classList.remove('cur'));
  document.querySelectorAll('#pageSeg .sb.ph').forEach(el => el.classList.remove('ph'));
  curStep = 0; lastDrawn = -1;
}

function setBpm(v){
  S.bpm = v;
  document.getElementById('bpmV').textContent = v;
  autosave();
  // scheduler reads tempo live via stepDur() — no transport to update
}

function setSwing(v){
  S.swing = v;
  document.getElementById('swingV').textContent = v + '%';
  autosave();
  // scheduler + export read S.swing live — off-beat (odd) steps get delayed
}

// ═══════════════════════════════════════════════
// MIDI EXPORT
// ═══════════════════════════════════════════════
function exportMidi(){
  const tpb = 480;                          // ticks per beat (quarter)
  const stepTicks = SUBDIV[S.subdiv].ticks; // step spacing matches sequencer resolution
  const gap = 6;                            // tiny note-off gap to avoid stuck notes
  // swing: odd (off-beat) steps shift later by S.swing% of a step — matches playback
  const swingTk = i => (i % 2 === 1) ? Math.round((S.swing / 100) * stepTicks) : 0;
  const mpb = Math.round(60000000 / S.bpm);

  // variable-length quantity encoder
  const vlq = v => {
    const b = [v & 0x7f]; v >>= 7;
    while (v > 0) { b.unshift((v & 0x7f) | 0x80); v >>= 7; }
    return b;
  };

  // Build one MTrk chunk from absolute-timed events.
  // events: [{tick, on:bool, note, vel}] ; prefix = optional meta bytes (e.g. tempo)
  function buildTrack(events, name, prefix=[], channel=0) {
    // sort by tick; at equal tick, note-offs before note-ons
    events.sort((a,b) => a.tick - b.tick || (a.on === b.on ? 0 : a.on ? 1 : -1));
    const body = [];
    const nm = [...name].map(c => c.charCodeAt(0));
    body.push(0x00, 0xff, 0x03, nm.length, ...nm);   // track name
    body.push(...prefix);                            // tempo etc (delta 0 inside prefix)
    let last = 0;
    events.forEach(e => {
      const dt = e.tick - last; last = e.tick;
      body.push(...vlq(dt), (e.on ? 0x90 : 0x80) | channel, e.note, e.on ? e.vel : 0);
    });
    body.push(0x00, 0xff, 0x2f, 0x00);               // end of track
    const len = body.length;
    return [0x4d,0x54,0x72,0x6b,(len>>24)&255,(len>>16)&255,(len>>8)&255,len&255, ...body];
  }

  // ── Chord track events ── (note spans d.len steps, swung off-beats)
  const chordEvents = [];
  chordSeq.forEach((d, i) => {
    if (d && d.midis) {
      const on = i * stepTicks + swingTk(i), off = on + (d.len || 1) * stepTicks - gap;
      d.midis.forEach(m => {
        chordEvents.push({tick: on,  on: true,  note: m, vel: 80});
        chordEvents.push({tick: off, on: false, note: m, vel: 0});
      });
    }
  });

  // ── Melody track events ── (note spans d.len steps, swung off-beats)
  const melEvents = [];
  melSeq.forEach((d, i) => {
    if (d && d.midi != null) {
      const on = i * stepTicks + swingTk(i), off = on + (d.len || 1) * stepTicks - gap;
      melEvents.push({tick: on,  on: true,  note: d.midi, vel: 95});
      melEvents.push({tick: off, on: false, note: d.midi, vel: 0});
    }
  });

  // ── Drum track events ── (GM drum map, channel 10; short one-shots, swung off-beats)
  const DRUM_NOTE = { kick: 36, snare: 38, hat: 42 };  // GM: C1 / D1 / F#1
  const drumEvents = [];
  ['kick','snare','hat'].forEach(voice => {
    drumSeq[voice].forEach((on, i) => {
      if (on) {
        const t = i * stepTicks + swingTk(i);
        drumEvents.push({tick: t,      on: true,  note: DRUM_NOTE[voice], vel: 100});
        drumEvents.push({tick: t + 30, on: false, note: DRUM_NOTE[voice], vel: 0});
      }
    });
  });

  // ── Bass track events ── (ch2, same span as its chord; only steps that were assigned with bass)
  const bassEvents = [];
  chordSeq.forEach((d, i) => {
    if (d && d.bass != null) {
      const on = i * stepTicks + swingTk(i), off = on + (d.len || 1) * stepTicks - gap;
      bassEvents.push({tick: on,  on: true,  note: d.bass, vel: 90});
      bassEvents.push({tick: off, on: false, note: d.bass, vel: 0});
    }
  });

  // tempo meta lives at the head of track 1 (chord)
  const tempo = [0x00, 0xff, 0x51, 0x03, (mpb>>16)&255, (mpb>>8)&255, mpb&255];
  const t1 = buildTrack(chordEvents, 'CHORD', tempo);
  const t2 = buildTrack(melEvents,  'MELODY');
  const t3 = buildTrack(drumEvents, 'DRUMS', [], 9);   // channel 10 (index 9) = GM drums
  // track 4 only when some step carries bass — the file matches what plays
  const tracks = [t1, t2, t3];
  if (bassEvents.length) tracks.push(buildTrack(bassEvents, 'BASS', [], 1));   // channel 2

  // Type-1 header: format=1
  const hdr = [0x4d,0x54,0x68,0x64, 0,0,0,6, 0,1, 0,tracks.length, (tpb>>8)&255, tpb&255];

  const bytes = new Uint8Array([...hdr, ...tracks.flat()]);
  // sanitize filename: C# → Cs, "dorian b2" → dorianb2
  const tag = `${S.key}_${S.mode}`.replace(/#/g,'s').replace(/\s+/g,'');
  saveFile(bytes, `soulpad_${tag}.mid`);
}

// Reliable download — Android Chrome + desktop.
// Two requirements that trip up mobile: (1) the <a> must be IN the DOM before click(),
// (2) octet-stream forces a real "save file" instead of routing .mid to a media player.
function saveFile(bytes, filename) {
  try {
    const blob = new Blob([bytes], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 4000);
  } catch (e) {
    alert('MIDI export failed: ' + (e && e.message ? e.message : e));
  }
}

// ═══════════════════════════════════════════════
// UI
// ═══════════════════════════════════════════════
function showTab(name,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('panel-'+name).classList.add('on');
}
function setExt(n,btn){ S.ext=n; btn.closest('.seg').querySelectorAll('.sb').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); buildChords(); }
function setBass(on,btn){ S.bass=on; btn.closest('.seg').querySelectorAll('.sb').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); autosave(); }
function setV(v,btn){ S.voicing=v; btn.closest('.seg').querySelectorAll('.sb').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); buildChords(); }
function setPM(m,btn){ S.playMode=m; btn.closest('.seg').querySelectorAll('.sb').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); killAll(); autosave(); }
function setMelOct(o,btn){ S.melOct=o; btn.closest('.seg').querySelectorAll('.sb').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); buildMelody(); }
function setChordOct(o,btn){ S.chordOct=o; btn.closest('.seg').querySelectorAll('.sb').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); buildChords(); }
function setSubdiv(v,btn){
  S.subdiv=v;
  btn.closest('.seg').querySelectorAll('.sb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  updateLoopLen();
  autosave();
  // scheduler reads S.subdiv live via stepDur() — adapts on the next step, no restart
}
function updateLoopLen(){
  const beats = STEPS * SUBDIV[S.subdiv].beats;   // total beats in the loop
  const bars = beats / 4;                          // assume 4/4
  const txt = bars >= 1 ? `${bars} bar${bars>1?'s':''}` : `${beats} beats`;
  const el = document.getElementById('loopLen');
  if (el) el.textContent = txt;
}
function onKeyMode(){
  S.key=document.getElementById('keyS').value;
  S.mode=document.getElementById('modeS').value;
  killAll();
  closePicker(true);
  requestAnimationFrame(() => {
    buildChords();
    buildMelody();
    buildSeq();
  });
}

// ═══════════════════════════════════════════════
// SESSION SAVE/LOAD (localStorage — works in real Chrome + PWA)
// ═══════════════════════════════════════════════
const SESSION_KEY = 'soulpad_session_v2';   // v2: S.ext, S.bass, chord step .bass
const SESSION_KEY_V1 = 'soulpad_session_v1'; // read once for migration, never written
let saveTimer = null;

function saveSession(){
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify({ S, SD, chordSeq, melSeq, drumSeq }));
  } catch(e) { /* storage blocked (e.g. preview) — silently skip */ }
}
function autosave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveSession, 400); }

function loadSession(){
  try {
    let raw = localStorage.getItem(SESSION_KEY);
    if (!raw) raw = localStorage.getItem(SESSION_KEY_V1);   // v1 → v2: same shape, fields added below
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.S) Object.assign(S, d.S);
    if (!EXTS.includes(S.ext)) S.ext = 7;   // v1 saves predate extensions
    S.bass = S.bass === true;               // v1 saves predate bass
    if (typeof d.SD === 'number') SD = d.SD;
    // only accept sequences that match current length (guards old 16-step saves)
    if (Array.isArray(d.chordSeq) && d.chordSeq.length === STEPS) {
      chordSeq = d.chordSeq.map(st => st ? { ...st, bass: Number.isInteger(st.bass) ? st.bass : null } : null);
    }
    if (Array.isArray(d.melSeq)   && d.melSeq.length   === STEPS) melSeq   = d.melSeq;
    if (d.drumSeq && d.drumSeq.kick && d.drumSeq.kick.length === STEPS) drumSeq = d.drumSeq;
  } catch(e) { /* corrupt or unavailable — start fresh */ }
}

function clearSession(){
  chordSeq = Array(STEPS).fill(null);
  melSeq   = Array(STEPS).fill(null);
  drumSeq  = { kick: Array(STEPS).fill(false), snare: Array(STEPS).fill(false), hat: Array(STEPS).fill(false) };
  viewPage = 0;
  document.querySelectorAll('#pageSeg .sb').forEach((b, i) => b.classList.toggle('on', i === 0));
  buildSeq(); buildDrums();   // these autosave the cleared state
}

// two-tap confirm so a stray tap never wipes a sketch
let clrArmed = false, clrTimer = null;
function onClear(btn){
  if (clrArmed) {
    clearTimeout(clrTimer); clrArmed = false;
    btn.textContent = 'CLR'; btn.classList.remove('arm');
    clearSession();
  } else {
    clrArmed = true; btn.textContent = 'SURE?'; btn.classList.add('arm');
    clrTimer = setTimeout(() => { clrArmed = false; btn.textContent = 'CLR'; btn.classList.remove('arm'); }, 3000);
  }
}

// push loaded state onto the on-screen controls
function syncSeg(id, val){
  document.querySelectorAll('#' + id + ' .sb').forEach(b => b.classList.toggle('on', b.dataset.val === String(val)));
}
function syncUI(){
  document.getElementById('keyS').value  = S.key;
  document.getElementById('modeS').value = S.mode;
  syncSeg('eseg', S.ext);
  syncSeg('bseg', S.bass);
  syncSeg('vseg', S.voicing);
  syncSeg('pseg', S.playMode);
  syncSeg('coseg', S.chordOct);
  syncSeg('oseg', S.melOct);
  syncSeg('subseg', S.subdiv);
  const bpmR = document.getElementById('bpmR'); if (bpmR){ bpmR.value = S.bpm; document.getElementById('bpmV').textContent = S.bpm; }
  const swR  = document.getElementById('swingR'); if (swR){ swR.value = S.swing; document.getElementById('swingV').textContent = S.swing + '%'; }
  const stR  = document.getElementById('strumR'); if (stR){ stR.value = Math.round(SD*1000); document.getElementById('strumV').textContent = Math.round(SD*1000) + 'ms'; }
}

// ── INIT ──
loadSession();
syncUI();
buildChords(); buildMelody(); buildSeq(); buildDrums(); updateLoopLen();
</script>

// PWA: register service worker only when served over http(s).
// Opening the file directly (file://) skips this silently — app works as before.
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
